<svg xmlns="http://www.w3.org/2000/svg" width="96" height="40" viewBox="0 0 96 40" role="img" aria-label="Live">
  <defs>
    <clipPath id="live-clip">
      <rect x="4" y="4" width="88" height="32" rx="16"/>
    </clipPath>
    <linearGradient id="live-shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <style>
      .btn {
        transform-origin: 48px 20px;
        animation: pop 2.4s ease-in-out infinite;
      }
      @keyframes pop {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.06); }
      }
    </style>
  </defs>
  <g class="btn" clip-path="url(#live-clip)">
    <rect x="4" y="4" width="88" height="32" rx="16" fill="#238636"/>
    <rect x="4" y="4" width="36" height="32" fill="url(#live-shine)" opacity="0.9">
      <animateTransform attributeName="transform" type="translate" values="-36 0;88 0;-36 0" dur="2.8s" repeatCount="indefinite"/>
    </rect>
    <circle cx="22" cy="20" r="4.2" fill="#3fb950" opacity="0.45">
      <animate attributeName="r" values="4.2;8;4.2" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0;0.45" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="22" cy="20" r="4" fill="#fff">
      <animate attributeName="opacity" values="1;0.55;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="34" y="25" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff">Live</text>
  </g>
</svg>
