      <path d="M7 2c0-1.6 1-2.4 1-2.4">
        <animate attributeName="opacity" values="0.25;1;0.25" dur="1.4s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 1.2;0 -1;0 1.2" dur="1.4s" repeatCount="indefinite"/>
      </path>
      <path d="M10 2c0-1.6 1-2.4 1-2.4">
        <animate attributeName="opacity" values="0.25;1;0.25" dur="1.4s" begin="0.25s" repeatCount="indefinite"/>
