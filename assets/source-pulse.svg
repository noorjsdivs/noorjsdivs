<svg xmlns="http://www.w3.org/2000/svg" width="280" height="28" viewBox="0 0 280 28" role="img" aria-label="Source is on Buy Me a Coffee">
  <style>
    .pill { fill: #FFDD00; }
    .label { font: 600 12px ui-sans-serif, system-ui, sans-serif; fill: #111; }
    .steam { fill: none; stroke: #111; stroke-width: 1.4; stroke-linecap: round; opacity: .35; animation: rise 1.5s ease-in-out infinite; }
    .steam-2 { animation-delay: .35s; }
    .sheen {
      fill: url(#shine);
      mix-blend-mode: screen;
      opacity: .55;
      animation: sweep 2.4s linear infinite;
    }
    @keyframes rise {
      0%, 100% { opacity: .15; transform: translateY(2px); }
      50% { opacity: .7; transform: translateY(-2px); }
    }
    @keyframes sweep {
      0% { transform: translateX(-280px); }
      100% { transform: translateX(280px); }
    }
  </style>
  <defs>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".7"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect class="pill" x="0" y="0" width="280" height="28" rx="14"/>
  <g transform="translate(16 6)">
    <path class="steam" d="M7 3c0-2 1.2-3 1.2-3"/>
    <path class="steam steam-2" d="M10 3c0-2 1.2-3 1.2-3"/>
    <path fill="#111" d="M4 8h10.5a.5.5 0 0 1 .5.5V11a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V8.5A.5.5 0 0 1 4 8z"/>
    <path fill="none" stroke="#111" stroke-width="1.4" stroke-linecap="round" d="M14.5 9.2h1.6A2.2 2.2 0 0 1 18 11.4 2.2 2.2 0 0 1 15.8 13h-1"/>
    <rect x="3.5" y="16.2" width="11" height="1.4" rx=".7" fill="#111"/>
  </g>
  <text class="label" x="44" y="18">Source on Buy Me a Coffee</text>
  <rect class="sheen" x="0" y="0" width="80" height="28"/>
</svg>
